version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: oxide_postgres
    restart: always
    environment:
      POSTGRES_DB: oxide_monitor
      POSTGRES_USER: oxide_user
      POSTGRES_PASSWORD: oxide_password
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxide_user -d oxide_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot-simulator:
    image: node:20-alpine
    container_name: oxide_bot_simulator
    working_dir: /app
    volumes:
      - ./simulator:/app/simulator
      - ./package.json:/app/package.json
    ports:
      - "8788:8788"
    command: ["node", "simulator/server.js"]
    restart: always

  central-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oxide_central_monitor
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://oxide_user:oxide_password@postgres:5432/oxide_monitor
      BOT_SIMULATOR_URL: http://bot-simulator:8788
    depends_on:
      postgres:
        condition: service_healthy
      bot-simulator:
        condition: service_started

volumes:
  pgdata:
